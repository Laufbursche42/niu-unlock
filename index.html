<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche NIU KQi Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <p class="hint infobox" data-t="infoBannerHtml"></p>

  <p class="warn" id="bt-note" data-t="btNote" hidden></p>

  <div class="card">
    <h2 data-t="s1Title"></h2>
    <p class="hint" data-t="sub"></p>
    <p class="hint" data-t="startHintGuide"></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <div class="card">
    <h2 data-t="s2Title"></h2>
    <div class="set-row">
      <label data-t="modelLabel"></label>
      <select id="model-in"></select>
    </div>
    <p class="hint" data-t="modelHint"></p>
    <p class="hint"><span data-t="encStatePrefix"></span> <b id="enc-state">-</b></p>

    <div class="card-head"><h2 data-t="keysTitle"></h2><button type="button" class="help-btn" data-help="keys" aria-label="Info">?</button></div>
    <p class="hint" data-t="keysHint"></p>
    <div class="key-row"><label data-t="lblSecret"></label><input id="secret-in" type="text" autocomplete="off" spellcheck="false" placeholder="blePassword"></div>
    <div class="key-row"><label data-t="lblAes"></label><input id="aes-in" type="text" autocomplete="off" spellcheck="false" placeholder="bleAes"></div>
    <div class="key-row"><label data-t="lblMac"></label><input id="mac-in" type="text" autocomplete="off" spellcheck="false" placeholder="AA:BB:CC:DD:EE:FF"></div>
    <p class="hint" data-t="macNote"></p>

    <div class="log-opt">
      <span data-t="showallLabel"></span>
      <input type="checkbox" id="showall">
    </div>
    <div class="btns">
      <button class="primary span2" id="btn-conn"></button>
    </div>
    <p class="hint" id="devinfo"></p>
    <p class="hint" data-t="controlsHint"></p>
  </div>

  <div class="card" id="live-card" hidden>
    <h2 data-t="liveTitle"></h2>
    <div class="grid">
      <div class="tile"><b id="t-speed">-</b><small data-t="tileSpeed"></small></div>
      <div class="tile"><b id="t-gear">-</b><small data-t="tileGear"></small></div>
      <div class="tile"><b id="t-max">-</b><small data-t="tileMax"></small></div>
      <div class="tile"><b id="t-maxrated">-</b><small data-t="tileMaxRated"></small></div>
      <div class="tile"><b id="t-mode">-</b><small data-t="tileMode"></small></div>
      <div class="tile"><b id="t-err">-</b><small data-t="tileErr"></small></div>
      <div class="tile"><b id="t-status">-</b><small data-t="tileStatus"></small></div>
    </div>
    <div class="btns">
      <button type="button" class="span2" id="btn-heartbeat" disabled data-t="btnHeartbeat"></button>
    </div>
    <p class="hint" data-t="liveHint"></p>
  </div>

  <div class="card" id="batt-card" hidden>
    <div class="card-head"><h2 data-t="battTitle"></h2><button type="button" class="help-btn" data-help="batt" aria-label="Info">?</button></div>
    <div class="grid">
      <div class="tile"><b id="t-range">-</b><small data-t="tileRange"></small></div>
    </div>
    <p class="hint" data-t="battHint"></p>
  </div>

  <div class="card" id="more-card" hidden>
    <div class="card-head"><h2 data-t="moreTitle"></h2><button type="button" class="help-btn" data-help="tuning" aria-label="Info">?</button></div>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <p class="warn bad" data-t="tuningReason"></p>
    <p class="warn bad" data-t="tuningLegal"></p>
    <div class="set-row">
      <label data-t="lblSpeedLimit"></label>
      <input type="number" id="speed-in" step="0.1" min="1" max="99" value="22">
      <button type="button" id="btn-speed" data-t="btnSend" data-ready-only disabled></button>
    </div>
    <p class="hint gate-reason" data-t="reasonFirmwareCap"></p>
    <div class="toggle-row">
      <label data-t="lblKick"></label>
      <button type="button" class="on" id="kick-on" data-t="btnOn" data-ready-only disabled></button>
      <button type="button" class="off" id="kick-off" data-t="btnOff" data-ready-only disabled></button>
    </div>
    <div class="toggle-row">
      <label data-t="lblCruise"></label>
      <button type="button" class="on" id="cruise-on" data-t="btnOn" data-ready-only disabled></button>
      <button type="button" class="off" id="cruise-off" data-t="btnOff" data-ready-only disabled></button>
    </div>
    <div class="toggle-row">
      <label data-t="lblFastlock"></label>
      <button type="button" class="on" id="fastlock-on" data-t="btnOn" data-ready-only disabled></button>
      <button type="button" class="off" id="fastlock-off" data-t="btnOff" data-ready-only disabled></button>
    </div>
    <p class="hint gate-reason" data-t="reasonUnverified"></p>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div class="set-row">
      <label data-t="lblUnit"></label>
      <select id="unit-in"><option value="km" data-t="optKm"></option><option value="mi" data-t="optMi"></option></select>
      <button type="button" id="btn-unit" data-t="btnSend" data-ready-only disabled></button>
    </div>
    <table class="kv"><tbody id="set-body"></tbody></table>
    <p class="hint" data-t="setHint"></p>
  </div>

  <div class="card" id="raw-card" hidden>
    <h2 data-t="advTitle"></h2>
    <table class="kv"><tbody id="adv-body"></tbody></table>
    <p class="hint" data-t="advHint"></p>
  </div>

  <div class="card">
    <h2 data-t="s6Title"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="Info">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="Info">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/niu-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="DISCLAIMER.de.md" data-doc="DISCLAIMER" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" id="help-x">&times;</button>
  </div>
  <div class="doc-body"><p id="help-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-no" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="primary" data-t="confirmOk"></button>
  </div>
</dialog>

<script src="aes.js?v=15"></script>
<script src="report-footer.js?v=15"></script>
<script src="i18n.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
